# Netlify configuration for Totals POS
# - Serves the static PWA from the repo root.
# - Runs the sync API (netlify/functions/api.mjs) and maps /api/* to it, so the
#   app's existing Cloud API base URL (this site's origin) just works.

[build]
  publish = "."
  functions = "netlify/functions"

# Route the app's sync calls to the function. e.g. /api/sync -> the handler.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
